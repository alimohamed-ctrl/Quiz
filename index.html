<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الموظفين التفاعلي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .input-group {
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .question-block {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-right: 5px solid #3498db;
        }
        .option-label {
            display: block;
            margin: 10px 0;
            cursor: pointer;
        }
        .option-label input {
            margin-left: 10px;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #27ae60;
        }
        #loading {
            text-align: center;
            font-size: 18px;
            color: #3498db;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>اختبار تقييم الموظفين</h1>
    
    <div class="input-group">
        <label for="employee-name">اسم الموظف ثلاثي:</label>
        <input type="text" id="employee-name" placeholder="أدخل اسمك هنا المربع قبل البدء">
    </div>

    <div id="loading">جاري تحميل الأسئلة من النظام...</div>
    <div id="quiz-container"></div>

    <button id="submit-btn" onclick="submitQuiz()" style="display: none;">إرسال الإجابات وإنهاء الاختبار</button>
</div>

<script src="script.js"></script>
</body>
</html>
