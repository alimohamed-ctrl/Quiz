<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار موظفين مبيعات مران</title>
    <style>
        /* تعريف الألوان للمظهرين اللامع والداكن */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --success: #22c55e;
            --danger: #ef4444;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* زر تبديل الوضع الليلي */
        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--border-color);
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-color);
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 30px;
            background: rgba(148, 163, 184, 0.05);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
            color: var(--primary);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            color: var(--text-color);
        }

        .question-block {
            background: rgba(148, 163, 184, 0.02);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            border-right: 5px solid var(--primary);
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin: 10px 0;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label input[type="radio"] {
            margin-left: 12px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }

        /* ألوان لوحة النتيجة والمراجعة */
        .correct-opt {
            border-color: var(--success) !important;
            background: rgba(34, 197, 94, 0.1) !important;
            color: var(--success) !important;
            font-weight: 600;
        }

        .wrong-opt {
            border-color: var(--danger) !important;
            background: rgba(239, 68, 68, 0.1) !important;
            color: var(--danger) !important;
            font-weight: 600;
        }

        .feedback-text {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(2, 132, 199, 0.1);
            border: 4px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 24px;
            font-weight: 700;
        }

        .score-circle span {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
        }

        button.main-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s;
        }

        button.main-btn:hover { background: var(--primary-hover); }
        #loading { text-align: center; color: var(--primary); font-weight: 500; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 وضع داكن</button>

    <div id="quiz-view">
        <h1>اختبار موظفين مبيعات مران</h1>
        <div class="subtitle">الرجاء التركيز والإجابة على كافة الأسئلة المطلوبة</div>
        
        <div class="input-group">
            <label for="employee-name">اسم الموظف بالكامل:</label>
            <input type="text" id="employee-name" placeholder="أدخل اسمك ثلاثياً أو رباعياً">
        </div>

        <div id="loading">جاري جلب حزمة الأسئلة المحدثة...</div>
        <div id="quiz-container"></div>

        <button id="submit-btn" class="main-btn" onclick="submitQuiz()" style="display: none;">إنهاء الاختبار وإرسال الإجابات</button>
    </div>

    <div id="result-view" style="display: none;">
        <h1>تقرير الأداء النهائي</h1>
        <div class="subtitle" id="employee-greeting">شكراً لك، تم حفظ درجتك بملف الإدارة بنجاح.</div>
        
        <div class="score-circle" id="percentageCircle">
            0%
            <span>النسبة المئوية</span>
        </div>
        <p style="text-align: center; font-weight: 600;" id="totalScoreText"></p>
        
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 30px 0;">
        <h2 style="font-size: 18px; margin-bottom: 20px;">مراجعة ورقة الإجابة التفصيلية:</h2>
        
        <div id="review-container"></div>
    </div>
    
    <div class="footer">منصة مران للمبيعات الرقمية © 2026</div>
</div>

<script src="script.js"></script>
</body>
</html>
