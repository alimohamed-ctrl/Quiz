<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار موظفين مبيعات مران</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --success: #4ade80;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            color: var(--text-color);
            margin: 0 0 10px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 35px;
            background: rgba(15, 23, 42, 0.4);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
            color: var(--primary);
            font-size: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .question-block {
            background: rgba(15, 23, 42, 0.2);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            border-right: 5px solid var(--primary);
        }

        .question-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 18px;
            color: var(--text-color);
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin: 10px 0;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        .option-label:hover {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.05);
        }

        .option-label input[type="radio"] {
            margin-left: 14px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        button {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--success);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(74, 222, 128, 0.3);
            margin-top: 30px;
        }

        button:hover {
            background: #22c55e;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(74, 222, 128, 0.4);
        }

        button:disabled {
            background: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #loading {
            text-align: center;
            font-size: 16px;
            color: var(--primary);
            padding: 30px 0;
            font-weight: 500;
        }
        
        .footer-credit {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area">
        <h1>اختبار موظفين مبيعات مران</h1>
        <div class="subtitle">الرجاء الإجابة على كافة الأسئلة بدقة وعناية</div>
    </div>
    
    <div class="input-group">
        <label for="employee-name">الاسم المربع للموظف:</label>
        <input type="text" id="employee-name" placeholder="اكتب اسمك الكامل هنا قبل البدء">
    </div>

    <div id="loading">جاري تهيئة بيئة الاختبار واستدعاء الأسئلة...</div>
    <div id="quiz-container"></div>

    <button id="submit-btn" onclick="submitQuiz()" style="display: none;">إنهاء الاختبار وإرسال التقرير</button>
    
    <div class="footer-credit">منصة مران للمبيعات الرقمية © 2026</div>
</div>

<script src="script.js"></script>
</body>
</html>
